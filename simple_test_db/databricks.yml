# This is a Declarative Automation Bundle definition for simple_test_db.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: simple_test_db
  uuid: f357e061-e1dd-4ffd-a50d-1f9fdae0b015

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-78d90a78-94e1.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-78d90a78-94e1.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/prabhuseeni94@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/prabhuseeni94@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: prabhuseeni94@gmail.com
        level: CAN_MANAGE
